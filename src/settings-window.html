<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tulip Settings</title>
  <link rel="stylesheet" href="renderer.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="settings-window.css">
  <link rel="stylesheet" href="styles-features.css">
  <link rel="stylesheet" href="controls.css">
</head>
<body class="settings-window">
  <header class="settings-window-title">Tulip Settings</header>
  <div class="settings" id="settings" hidden>
    <div class="settings-box">
      <nav class="settings-rail" id="settings-rail" aria-label="Settings sections"></nav>
      <main class="settings-pane">
        <header class="settings-head">
          <h1 class="settings-heading" id="settings-title">Appearance</h1>
          <button id="settings-close" hidden aria-label="Close settings"></button>
        </header>
        <div class="settings-body" id="settings-body"></div>
      </main>
    </div>
  </div>
  <script type="module" src="settings-window.js"></script>
</body>
</html>

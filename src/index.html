<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: tulip-file:; media-src tulip-file:; font-src 'self';" />
  <title>Tulip</title>
  <link rel="stylesheet" href="renderer.css" />
</head>
<body>
  <div id="app" class="app" data-sidebar="open" data-ai="closed">

    <div class="titlebar"></div>

    <aside class="sidebar" id="sidebar">
      <header class="sidebar-head">
        <button class="vault-name" id="vault-name" title="Open another vault">
          <span id="vault-label">No vault</span>
        </button>
        <div class="sidebar-actions">
          <button class="icon-btn" id="btn-new-note" title="New note (⌘N)" aria-label="New note">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-new-folder" title="New folder (⌘⇧N)" aria-label="New folder">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 5.2a1 1 0 0 1 1-1h2.6l1.2 1.4H13a1 1 0 0 1 1 1v5.2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btn-search" title="Search vault (⌘⇧F)" aria-label="Search vault">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m10.2 10.2 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <nav class="tree" id="tree" aria-label="Notes"></nav>

      <footer class="sidebar-foot">
        <span id="note-count"></span>
      </footer>
    </aside>

    <main class="main">
      <div class="doc-head" id="doc-head">
        <div class="crumbs" id="crumbs"></div>
        <div class="doc-tools">
          <div class="view-switch" id="view-switch" role="group" aria-label="View">
            <button class="view-btn" data-view="read" title="Reading view (⌘1)" aria-label="Reading view">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 4.4S6.6 3.2 3.4 3.2v8.2C6.6 11.4 8 12.6 8 12.6s1.4-1.2 4.6-1.2V3.2C9.4 3.2 8 4.4 8 4.4z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 4.6v8" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="view-btn" data-view="edit" title="Editing view (⌘2)" aria-label="Editing view">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M10.6 2.9 13.1 5.4 6 12.5l-3.2.7.7-3.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9.2 4.3 11.7 6.8" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="view-btn" data-view="raw" title="Raw view (⌘3)" aria-label="Raw view">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.9 4.3 2.6 8l3.3 3.7M10.1 4.3 13.4 8l-3.3 3.7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="editor-host" id="editor-host"></div>
        <article class="reading" id="reading" hidden></article>
      </div>

      <div class="empty" id="empty">
        <button class="ghost" id="btn-open-vault">Open a vault</button>
      </div>

      <footer class="status" id="status">
        <span id="status-left"></span>
        <span class="status-end">
          <span id="status-right"></span>
          <button class="zoom" id="zoom" hidden title="Back to actual size">100%</button>
        </span>
      </footer>
    </main>

    <aside class="ai" id="ai" data-busy="no">
      <header class="ai-head">
        <span class="ai-title">Assistant</span>
        <div class="ai-head-end">
          <button class="icon-btn" id="ai-close" title="Close assistant (⌘⇧A)" aria-label="Close assistant">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div class="ai-log" id="ai-log" role="log" aria-live="polite"></div>

      <form class="ai-compose" id="ai-compose">
        <textarea id="ai-input" class="ai-input" rows="1" placeholder="Write a message…"
                  autocomplete="off" spellcheck="true"></textarea>

        <div class="ai-tools">
          <div class="ai-tools-start">
            <button type="button" class="ai-chip" id="ai-attach"
                    title="Mention the open note" aria-label="Mention the open note">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="ai-chip" id="ai-write" aria-pressed="true"
                    title="Let the assistant edit notes" aria-label="Let the assistant edit notes">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M10.4 2.7 13.3 5.6 6 12.9l-3.4.5.5-3.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 4.1 11.9 7" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
          </div>

          <div class="ai-tools-end">
            <span class="ai-status" id="ai-status"></span>
            <div class="ai-picker">
              <select class="ai-provider" id="ai-provider" aria-label="Model"></select>
              <svg class="ai-caret" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="m4.5 6.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <button type="button" class="ai-go" id="ai-stop" hidden aria-label="Stop">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="6" height="6" rx="1.2" fill="currentColor"/></svg>
            </button>
            <button type="button" class="ai-go is-send" id="ai-send" aria-label="Send">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 12.6V3.8M4.4 7.4 8 3.7l3.6 3.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </form>
    </aside>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Quick switcher">
      <input id="panel-input" class="panel-input" type="text" autocomplete="off" spellcheck="false" />
      <ul class="panel-list" id="panel-list" role="listbox"></ul>
      <div class="panel-foot" id="panel-foot"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="ctx" id="ctx" hidden></div>

  <script src="renderer.js"></script>
</body>
</html>

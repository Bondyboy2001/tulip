name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            command: npm run package:mac
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac.yml
          - name: Windows
            os: windows-latest
            command: npm run package:win
            files: |
              release/*.exe
              release/*.zip
              release/*.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    env:
      # Signing turns itself on when the certificates are present and stays off
      # when they are not, so a fork — or this repository before the
      # certificates exist — still produces working unsigned builds rather than
      # a failed job. See CONTRIBUTING.md for what each secret is and how to
      # produce it.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE != '' }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Notarization is a separate switch from signing, and asking for it
      # without an Apple ID fails the build — so it is added to the command
      # rather than set in package.json, only on the run that can satisfy it.
      # An unsigned build takes the plain command and is unaffected.
      - name: Package
        run: ${{ matrix.command }}${{ matrix.name == 'macOS' && secrets.APPLE_ID != '' && ' -c.mac.notarize=true' || '' }}

      # Says in the log which kind of build this is. Without it, an unsigned
      # release looks exactly like a signed one until a user tries to open it.
      - name: Report signing status
        shell: bash
        run: |
          if [ -n "${{ secrets.MAC_CERTIFICATE }}${{ secrets.WINDOWS_CERTIFICATE }}" ]; then
            echo "Signed build."
          else
            echo "::warning::Unsigned build — macOS Gatekeeper will refuse it and Windows SmartScreen will warn. See CONTRIBUTING.md."
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: tulip-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes --verify-tag

# Tulip runs a real Electron window in several of its test suites — the table,
# reading and UI-contract tests drive an offscreen BrowserWindow rather than a
# DOM emulation — so CI runs on the same operating systems the app ships on
# rather than on a Linux container.
name: CI

on:
  push:
    branches: ['**']
    # A tag is what turns a run into a release; see the `release` job.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the thing under test,
      # and a run that silently resolves a different tree proves nothing.
      - name: Install
        run: npm ci

      # Before the suite, because it is the cheap half: a `no-undef` takes two
      # seconds to find and a test run takes minutes to fail on the same thing.
      # The rule set is small and every rule in it fires only on a defect —
      # see the account in eslint.config.mjs, including the one rule written
      # for this codebase after three launch-time crashes got through.
      - name: Lint
        run: npm run lint

      # The whole tree typechecks clean under `tsc --checkJs` with
      # `strictNullChecks` (see tsconfig.json for why that check exists), and
      # this gates it: every module is on the clean list at a ceiling of zero
      # (see the header of scripts/typecheck-gate.mjs), so the class of bug
      # that has actually shipped here twice (a null deref reachable before
      # the thing is built) fails the build instead of shipping a third time.
      - name: Typecheck (gated modules)
        run: npm run typecheck:gate

      # test:kernel spawns a real `jupyter server` and speaks the real protocol
      # to it — there is no mock, on purpose, because the failures it exists to
      # catch are the ones a mock would be written not to have. Without Jupyter
      # installed that suite skips itself, and a skip in CI is indistinguishable
      # from a pass: the only place the kernel is covered would report green for
      # a machine that never asked. So CI installs it and sets
      # TULIP_REQUIRE_JUPYTER, which turns the skip into a failure.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jupyter
        run: python -m pip install --disable-pip-version-check jupyter-server ipykernel

      - name: Test
        run: npm test
        env:
          TULIP_REQUIRE_JUPYTER: '1'

      - name: Build
        run: npm run build

      # The production build swaps a staged directory into place. This asserts
      # that a build failing midway leaves the previous dist intact instead of
      # a half-written one.
      - name: Staged-swap failure is safe
        run: npm run test:build-staging

      # After the build, because the boot bench launches the built app. A slow
      # launch is the regression this project keeps having — `npm run verify`
      # has gated on these numbers all along, and CI not running them meant the
      # one check nobody remembers to run locally was also the one check CI
      # skipped. The thresholds have headroom over a developer machine; if a
      # hosted runner turns out not to fit under them, the answer is to raise
      # the number in the bench with a note saying why, not to drop the step.
      - name: Performance gates
        run: npm run test:performance

      # Advisories are a build failure, not a notice someone scrolls past. The
      # overrides in package.json exist to keep this green; when it goes red,
      # the fix is a new override or an upstream bump, not a lowered threshold.
      - name: Audit
        run: npm audit --audit-level=moderate

  package:
    name: package (macOS)
    runs-on: macos-latest
    env:
      TULIP_NO_VERSION_BUMP: '1'
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate signing configuration
        shell: bash
        run: |
          if [[ -n "$MACOS_CERTIFICATE" || -n "$MACOS_CERTIFICATE_PASSWORD" || -n "$MACOS_SIGN_IDENTITY" ]]; then
            [[ -n "$MACOS_CERTIFICATE" && -n "$MACOS_CERTIFICATE_PASSWORD" && -n "$MACOS_SIGN_IDENTITY" ]] || {
              echo "macOS signing needs MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD and MACOS_SIGN_IDENTITY" >&2
              exit 1
            }
          fi
          if [[ -n "$APPLE_ID" || -n "$APPLE_TEAM_ID" || -n "$APPLE_APP_PASSWORD" ]]; then
            [[ -n "$MACOS_CERTIFICATE" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]] || {
              echo "notarisation needs the signing certificate and all three Apple credentials" >&2
              exit 1
            }
          fi

      # Secrets are optional so forks and ordinary pushes still prove the
      # ad-hoc path. On the release repository they turn the same packaging
      # command into a Developer ID build and give it a temporary notarytool
      # profile; neither the certificate nor its password is printed.
      - name: Import signing identity
        if: env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          CERTIFICATE="$RUNNER_TEMP/tulip-signing.p12"
          KEYCHAIN="$RUNNER_TEMP/tulip-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          echo "TULIP_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "TULIP_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_ID" ]]; then
            xcrun notarytool store-credentials tulip-ci \
              --keychain "$KEYCHAIN" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "TULIP_NOTARY_PROFILE=tulip-ci" >> "$GITHUB_ENV"
          fi

      - name: Tag and package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # Packaging exercises signing, the icon pipeline and Info.plist. The
      # no-bump flag keeps an already-versioned tag exact.
      - name: Package the app
        run: ./scripts/build-app.sh --no-install

      # A bundle that assembles but will not launch is the failure mode worth
      # catching: the payload must be present and the signature must verify.
      - name: The bundle is well formed
        run: |
          test -f build/Tulip.app/Contents/MacOS/Tulip
          test -f build/Tulip.app/Contents/Resources/app/electron/main.js
          test -f build/Tulip.app/Contents/Resources/app/dist/renderer.js
          codesign --verify --deep --strict --verbose=2 build/Tulip.app

      - name: The packaged app launches and writes a vault
        run: npm run test:packaged-app -- build/Tulip.app/Contents/MacOS/Tulip

      - name: Recovery survives interrupted edits and writes
        run: npm run test:recovery-app -- build/Tulip.app/Contents/MacOS/Tulip

      - name: Document recovery unifies versions and backup copies
        run: npm run test:document-recovery -- build/Tulip.app/Contents/MacOS/Tulip

      - name: Right panels resize in column and drawer layouts
        run: npm run test:panel-resize -- build/Tulip.app/Contents/MacOS/Tulip

      - name: Workspaces restore across app launches
        run: npm run test:workspace-app -- build/Tulip.app/Contents/MacOS/Tulip

      - name: Create the disk image
        run: ./scripts/package-dmg.sh

      # Zipped rather than uploaded as a directory: the upload action does not
      # preserve the executable bit or the symlinks inside a .app, and a bundle
      # that arrives without either is a bundle that will not launch. `ditto`
      # is the tool that gets macOS bundles into an archive intact.
      - name: Archive the bundle
        run: ditto -c -k --keepParent build/Tulip.app build/Tulip-macos.zip

      # Until now every build CI made was thrown away at the end of the job,
      # and the only way to have Tulip was to clone it and build it yourself.
      # This is still not a release — the bundle is ad-hoc signed, so another
      # machine has to be told to trust it (see the README) — but it is a
      # download, and a download is what makes a bug report reproducible.
      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: Tulip-macos
          path: |
            build/Tulip-macos.dmg
            build/Tulip-macos.zip
          # Long enough to bisect a regression across a few weeks of pushes,
          # short enough that the account is not storing every build ever made.
          retention-days: 30

      - name: Remove signing material
        if: always() && env.MACOS_CERTIFICATE != ''
        shell: bash
        run: |
          security delete-keychain "$TULIP_SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/tulip-signing.p12"

  package-windows:
    name: package (Windows)
    runs-on: windows-latest
    env:
      TULIP_NO_VERSION_BUMP: '1'
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # rcedit is what stamps the icon and version strings into the .exe. The
      # packager runs without it, so it is installed here rather than carried as
      # a dependency of the project.
      - run: npm i -D rcedit --no-save

      - name: Validate signing configuration
        shell: bash
        run: |
          if [[ -n "$WINDOWS_CERTIFICATE" || -n "$WINDOWS_CERTIFICATE_PASSWORD" ]]; then
            [[ -n "$WINDOWS_CERTIFICATE" && -n "$WINDOWS_CERTIFICATE_PASSWORD" ]] || {
              echo "Windows signing needs WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD" >&2
              exit 1
            }
          fi

      - name: Import signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'tulip-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "TULIP_WIN_CERT=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TULIP_WIN_CERT_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package the app
        run: npm run app:win -- --zip

      - name: The folder is well formed
        shell: bash
        run: |
          test -f build/Tulip-win32-x64/Tulip.exe
          test ! -f build/Tulip-win32-x64/electron.exe
          test -f build/Tulip-win32-x64/resources/app/electron/main.js
          test -f build/Tulip-win32-x64/resources/app/dist/renderer.js
          test ! -f build/Tulip-win32-x64/resources/default_app.asar

      - name: The packaged app launches and writes a vault
        shell: bash
        run: npm run test:packaged-app -- build/Tulip-win32-x64/Tulip.exe

      # The same battery the macOS bundle gets. These run in the `verify` job's
      # windowed lane all along, but against the source tree; here they run
      # against the assembled folder, where the failures they exist to catch —
      # a path that only breaks once packaged, a rename Windows refuses — are
      # actually reachable.
      - name: Recovery survives interrupted edits and writes
        shell: bash
        run: npm run test:recovery-app -- build/Tulip-win32-x64/Tulip.exe

      - name: Document recovery unifies versions and backup copies
        shell: bash
        run: npm run test:document-recovery -- build/Tulip-win32-x64/Tulip.exe

      - name: Right panels resize in column and drawer layouts
        shell: bash
        run: npm run test:panel-resize -- build/Tulip-win32-x64/Tulip.exe

      - name: Workspaces restore across app launches
        shell: bash
        run: npm run test:workspace-app -- build/Tulip-win32-x64/Tulip.exe

      - name: Verify Authenticode signature
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: signtool verify /pa /v build/Tulip-win32-x64/Tulip.exe

      # A portable folder, so it goes up as it is — the upload action zips it,
      # and Windows has no executable bit to lose on the way.
      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: Tulip-windows
          path: build/Tulip-*-win32-x64.zip
          retention-days: 30

      - name: Remove signing material
        if: always() && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP/tulip-signing.pfx" -Force -ErrorAction SilentlyContinue

  # A tagged commit becomes a downloadable release, built by the same two jobs
  # that already prove the packaging works — so what is published is the thing
  # CI verified, not a second build made specially for the occasion.
  #
  # `v0.1.26` is the shape of the tag. The version in package.json is advanced
  # by the release scripts themselves (build-app.sh and build-win.mjs, behind
  # `--release`), so tagging is the last step and not the first: tag the commit
  # whose package.json already says what it is.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package, package-windows]
    runs-on: ubuntu-latest
    permissions:
      # The only write this workflow asks for anywhere, and only on a tag.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Tulip-macos/Tulip-macos.dmg
            artifacts/Tulip-macos/Tulip-macos.zip
            artifacts/Tulip-windows/*.zip
          # Both builds are ad-hoc signed unless the signing secrets are set,
          # and a download that has to be argued past Gatekeeper should say so
          # where somebody will read it rather than in a README they have not
          # opened yet.
          body: |
            Built by CI from ${{ github.sha }}.

            **macOS** — open `Tulip-macos.dmg` and drag Tulip to Applications.
            With the repository signing secrets configured, the app and disk
            image are Developer ID signed, notarised and stapled. The zip is an
            alternate copy of the same verified app.

            **Windows** — unzip the portable build anywhere and run `Tulip.exe`.
            It is Authenticode-signed when the repository certificate is configured.

            If a signing secret is absent, CI deliberately falls back to the
            ad-hoc/unsigned build; Gatekeeper or SmartScreen will then warn.
          generate_release_notes: true

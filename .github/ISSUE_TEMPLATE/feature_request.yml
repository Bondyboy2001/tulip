name: Feature request
description: Something Tulip should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, rather than the feature. Tulip is meant to stay calm and
        small, so the shape of a change usually follows from the problem it is
        solving rather than the other way around.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. How you imagine it working, if you have a view.

  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it today
      description: Optional. What you do instead, and where that falls short.
